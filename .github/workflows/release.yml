name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v"
        required: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=SpyGlasses-$VERSION-macos.zip" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          BUILD_CONFIGURATION: release
          INSTALL_APP: "0"
        run: ./script/build_install.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/SpyGlasses.app "dist/$ZIP_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpyGlasses-macOS
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "SpyGlasses $APP_VERSION" \
              --notes "SpyGlasses $APP_VERSION"

          gh release upload "$GITHUB_REF_NAME" "dist/$ZIP_NAME" --clobber
